services:
  devops_lessons_backend:
    depends_on:
      mongo:
        condition: service_started
    image: tamatini/devops-lessons-backend:1.0.232
    ports:
      - 3000:3000
    environment:
      MONGO_URL: mongodb://admin:password@mongo:27017/lessons
      MONGO_DB: lessons

  mongo:
    restart: on-failure
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INIT_DATABASE: lessons
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  mongo-express:
    ## default login : admin
    ## default password : pass
    restart: on-failure
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      MONGO_INIT_DATABASE: lessons
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongo